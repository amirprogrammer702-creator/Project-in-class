<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W3 Schools Email Template</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    @media (min-width: 992px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 320px;
        height: 100vh;
        overflow-y: auto;
        z-index: 1000;
      }
      .main {
        margin-left: 320px;
        padding: 20px;
      }
    }
  
    #Borge { display: block; }
    .email { display: none; }
    
    .new-btn {
      background-color: #6c757d;
      border: none;
      color: white;
      padding: 12px 20px;
      text-align: left;
      width: 100%;
      font-size: 16px;
      transition: 0.3s;
    }
    .new-btn:hover {
      background-color: #5a6268;
      color: white;
    }
    .new-btn i {
      margin-right: 10px;
    }
    .accordion-button:not(.collapsed) {
      background-color: #dc3545 !important;
      color: white !important;
      box-shadow: none;
    }
    .list-group-item-action {
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-body-tertiary">

<div class="d-lg-none position-fixed top-0 start-0 end-0 bg-white shadow d-flex justify-content-between align-items-center p-3" style="z-index: 1055;">
  <button class="btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
    <i class="fa fa-bars fs-3 text-dark"></i>
  </button>
  <button class="btn btn-light" onclick="openNewMessage()">
    <i class="fa fa-pencil fs-3 text-danger"></i>
  </button>
</div>

<nav class="sidebar bg-white shadow d-none d-lg-block">
  <div class="p-4 border-bottom bg-light text-center">
    <img src="https://www.w3schools.com/images/w3schools.png" class="img-fluid" style="max-width: 180px;" alt="Logo">
  </div>
<button type="button" class=" p-3 w-100 border-0 bg-secondary text-light " data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@mdo">New message</button>


<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">New message</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">Recipient:</label>
            <input type="text" class="form-control" id="recipient-name">
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label">Message:</label>
            <textarea class="form-control" id="message-text"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Send message</button>
      </div>
    </div>
  </div>
</div>
  <div class="accordion accordion-flush" id="sidebarAccordion">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button bg-light fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#inboxDesktop">
          <i class="fa fa-inbox me-2"></i>Inbox (3)
        </button>
      </h2>
      <div id="inboxDesktop" class="accordion-collapse collapse show">
        <div class="list-group list-group-flush">
          <a onclick="getmail(0)" class="list-group-item list-group-item-action py-3">
            <div class="d-flex align-items-center">
              <img src="https://www.w3schools.com/w3images/avatar3.png" class="rounded-circle me-3" style="width: 45px; height: 45px;">
<div class="overflow-hidden" id="mailInfo"></div>

            </div>
          </a>
          <a onclick="getmail(1)" class="list-group-item list-group-item-action py-3">
            <div class="d-flex align-items-center">
              <img src="https://www.w3schools.com/w3images/avatar5.png" class="rounded-circle me-3" style="width: 45px; height: 45px;">
      <div class="overflow-hidden" id="mailInfo"></div>
            </div>
          </a>
          <a onclick="getmail(2)" class="list-group-item list-group-item-action py-3">
            <div class="d-flex align-items-center">
              <img src="https://www.w3schools.com/w3images/avatar2.png" class="rounded-circle me-3" style="width: 45px; height: 45px;">
          
<div class="overflow-hidden" id="mailInfo"></div>

            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
  <div class="list-group list-group-flush">
    <a href="#" class="list-group-item list-group-item-action py-3"><i class="fa fa-paper-plane me-3"></i>Sent</a>
    <a href="#" class="list-group-item list-group-item-action py-3"><i class="fa fa-hourglass-end me-3"></i>Drafts</a>
    <a href="#" class="list-group-item list-group-item-action py-3"><i class="fa fa-trash me-3"></i>Trash</a>
  </div>
</nav>

<div class="offcanvas offcanvas-start bg-white" tabindex="-1" id="mobileMenu" style="width: 280px;">
  <div class="offcanvas-header bg-light">
    <h5 class="offcanvas-title">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0">
    <button class="new-btn" onclick="openNewMessage()">
      <i class="fa fa-pencil"></i>New Message
    </button>
    <div class="list-group list-group-flush">
        <a href="#"  class="list-group-item list-group-item-action py-3 border-bottom">Inbox (3)</a>
        <a href="# " class="list-group-item list-group-item-action py-3">Sent</a>
        <a href="#"  class="list-group-item list-group-item-action py-3">Trash</a>
    </div>
  </div>
</div>

<div class="main pt-5 pt-lg-3">
  
  <div id="Borge" class="email card shadow-sm p-4 mb-4">
    <div class="d-flex align-items-center mb-4">
      <img id="mailpic" src="" class="rounded-circle me-3 img-fluid w-25" >
      <div>
        <h4 class="mb-0" id="subject"></h4>
        <small class="text-muted" id="from"></small> ,<span id="maildate"></span>
      </div>
    </div>
    <div class="mb-3">
      <button class="btn btn-light btn-sm"><i class="fa fa-reply me-1"></i> Reply</button>
      <button class="btn btn-light btn-sm"><i class="fa fa-arrow-right me-1"></i> Forward</button>
    </div>
    <hr>
   <p id="mailbody"></p>
  </div>


</div>

<div class="modal fade" id="newMessageModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">New Message</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <input type="text" class="form-control border-top-0 border-start-0 border-end-0 rounded-0" placeholder="To">
          </div>
          <div class="mb-3">
            <input type="text" class="form-control border-top-0 border-start-0 border-end-0 rounded-0" placeholder="Subject">
          </div>
          <div class="mb-3">
            <textarea class="form-control" rows="6" placeholder="What's on your mind?"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger px-4">Send <i class="fa fa-paper-plane ms-1"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
const mailInfo = document.getElementById("mailInfo");

function renderMail(name, subject) {
  mailInfo.innerHTML = ""; 

  const h6 = document.createElement("h6");
  h6.className = "mb-0 fw-bold";
  h6.textContent = name;

  const small = document.createElement("small");
  small.className = "text-muted d-block text-truncate";
  small.textContent = subject;

  mailInfo.append(h6, small);
}
